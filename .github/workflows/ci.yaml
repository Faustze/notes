name: Build and Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    if: ${{ github.repository == 'Faustze/notes' }}
    # Сайт собирается и деплоится только на Linux — матрица из трёх ОС лишь
    # утраивала время CI без пользы для этого репозитория.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # Та же версия, что и в deploy.yml, — проверяем то, что деплоим.
          node-version-file: ".node-version"
          cache: "npm"

      - run: npm ci

      # quartz.lock.json was dropped in the npm-specifier migration, so
      # `quartz plugin install` is a no-op; this regenerates .quartz/plugins.
      - name: Install Quartz plugins
        run: npm run install-plugins
        env:
          NODE_OPTIONS: "--no-warnings --experimental-require-module"

      - name: Check types and style
        run: npm run check

      - name: Test
        run: npm test

      - name: Ensure Quartz builds, check bundle info
        run: npx quartz build --bundleInfo -d docs
