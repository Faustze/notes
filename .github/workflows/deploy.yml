name: Deploy to GitHub Pages

on:
  # Запускается при пуше в main
  push:
    branches: [main]
  # Ручной запуск
  workflow_dispatch:
  # Автоматическая синхронизация раз в сутки
  schedule:
    - cron: "0 3 * * *"

# По умолчанию — только чтение; каждый job добирает ровно те права, что ему нужны.
permissions:
  contents: read

# Одновременно только один деплой
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Ruleset "Protect main branch" пускает изменения в main только через PR,
  # поэтому sync-коммит не пушится в main, а уходит в ветку sync/vault с PR,
  # который мерджится вручную. Сайт при этом не ждёт мерджа: job deploy сам
  # синкает vault перед сборкой, так что опубликованы всегда свежие заметки.
  #
  # Здесь не запускается никакой сторонний код (ни npm ci, ни Quartz-плагины):
  # только git, rsync, gh и наш shell-скрипт — поэтому токену с правом записи
  # здесь нечего опасаться.
  sync-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Токен нужен только шагу пуша — передаём его туда явно.
          persist-credentials: false

      - name: Sync Obsidian Notes
        env:
          OBSIDIAN_VAULT_TOKEN: ${{ secrets.OBSIDIAN_VAULT_TOKEN }}
        run: bash scripts/sync-obsidian-notes.sh

      - name: Open or update sync PR
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: sync/vault
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # add -A: rsync --delete удаляет заметки, их удаление тоже коммитим.
          git add -A content/
          if git diff --cached --quiet; then
            echo "content/ уже совпадает с vault — PR не нужен"
            exit 0
          fi
          # core.hooksPath=/dev/null: в CI хуки не нужны.
          git -c core.hooksPath=/dev/null commit -m "sync: update vault notes"
          # Токен передаётся только этой команде через env и не попадает
          # ни в .git/config, ни в аргументы процесса.
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          # Ветка каждый раз пересобирается от свежего main, поэтому --force:
          # это служебная ветка бота, руками в неё не коммитят.
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $AUTH" \
            git -c core.hooksPath=/dev/null push --force "https://github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${BRANCH}"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')" ]; then
            gh pr create --head "$BRANCH" --base main \
              --title "sync: update vault notes" \
              --body "Автоматический синк \`content/\` из Obsidian-vault. На сайте эти изменения уже опубликованы — PR лишь фиксирует их в репозитории. После мерджа запусти локально \`npm run translate\`, если CI предупредил об устаревшем \`content-ru/\`."
          else
            echo "PR из ${BRANCH} уже открыт — обновлён force-push'ем"
          fi

  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Не сохраняем токен в .git/config: дальше запускается сторонний код
          # (npm-пакеты, Quartz-плагины), который мог бы его прочитать.
          persist-credentials: false

      # До npm ci: пока не запущен сторонний код, токен vault (read-only)
      # живёт только в env этого шага.
      - name: Sync Obsidian Notes
        env:
          OBSIDIAN_VAULT_TOKEN: ${{ secrets.OBSIDIAN_VAULT_TOKEN }}
        run: bash scripts/sync-obsidian-notes.sh

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # content-ru/ переводится локально (через Claude Code) и коммитится вручную;
      # CI только предупреждает, если свежий синк принёс непереведённые заметки.
      - name: Check RU translations are fresh
        run: |
          if ! npm run --silent translate:check; then
            echo "::warning title=content-ru устарел::Есть непереведённые заметки — запусти 'npm run translate' локально и закоммить content-ru/."
          fi

      - name: Install Quartz plugins
        run: npm run install-plugins
        env:
          NODE_OPTIONS: "--no-warnings --experimental-require-module"

      - name: Build Quartz (EN)
        run: npx quartz build

      # Без continue-on-error: если RU-сборка упала, лучше не деплоить вовсе,
      # чем молча выкатить сайт с 404 на /ru/.
      - name: Build Quartz (RU)
        run: npm run build:ru

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
