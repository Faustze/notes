name: Deploy to GitHub Pages

on:
  # Запускается при пуше в main
  push:
    branches: [main]
  # Ручной запуск
  workflow_dispatch:
  # Автоматическая синхронизация каждые 6 часов
  schedule:
    - cron: "0 */6 * * *"

# Разрешения для GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Одновременно только один деплой
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Sync Obsidian Notes
        env:
          OBSIDIAN_VAULT_TOKEN: ${{ secrets.OBSIDIAN_VAULT_TOKEN }}
        run: bash scripts/sync-obsidian-notes.sh

      - name: Create PR with synced notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/obsidian-notes/
          if ! git diff --cached --quiet; then
            BRANCH="sync/obsidian-notes-$(date +%Y%m%d-%H%M%S)"
            git checkout -b "$BRANCH"
            git commit -m "sync: update obsidian notes [skip ci]"
            git push origin "$BRANCH"
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "sync: update obsidian notes" \
              --body "Automated sync of Obsidian notes from vault." \
              --label "automated" || true
            git checkout main
          else
            echo "No changes to commit"
          fi

      - name: Install Quartz plugins
        run: npx tsx ./quartz/plugins/loader/install-plugins.ts
        env:
          NODE_OPTIONS: "--no-warnings --experimental-require-module"

      - name: Build Quartz
        run: npx quartz build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
