name: Deploy to GitHub Pages

on:
  # Запускается при пуше в main
  push:
    branches: [main]
  # Ручной запуск
  workflow_dispatch:
  # Автоматическая синхронизация раз в сутки
  schedule:
    - cron: "0 3 * * *"

# Минимальные права GITHUB_TOKEN: пуш sync-коммита идёт через PAT_TOKEN,
# поэтому contents: write здесь не нужен.
permissions:
  contents: read
  pages: write
  id-token: write

# Одновременно только один деплой
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Не сохраняем токен в .git/config: дальше запускается сторонний код
          # (npm-пакеты, Quartz-плагины), который мог бы его прочитать.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Sync Obsidian Notes
        env:
          OBSIDIAN_VAULT_TOKEN: ${{ secrets.OBSIDIAN_VAULT_TOKEN }}
        run: bash scripts/sync-obsidian-notes.sh

      - name: Commit synced notes
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/
          if ! git diff --cached --quiet; then
            git commit -m "sync: update vault notes [skip ci]"
            # Токен передаётся только этой команде через env и не попадает
            # ни в .git/config, ни в аргументы процесса.
            AUTH=$(printf 'x-access-token:%s' "$PAT_TOKEN" | base64 -w0)
            echo "::add-mask::$AUTH"
            GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $AUTH" \
              git push "https://github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          else
            echo "No changes to commit"
          fi

      # content-ru/ is translated by hand (via Claude Code) and committed to the
      # repo directly, same as content/ — CI never calls a translation API, it
      # just builds whatever RU content is currently committed.
      - name: Install Quartz plugins
        run: npx tsx ./quartz/plugins/loader/install-plugins.ts
        env:
          NODE_OPTIONS: "--no-warnings --experimental-require-module"

      - name: Build Quartz (EN)
        run: npx quartz build

      - name: Build Quartz (RU)
        continue-on-error: true
        run: |
          mkdir -p content-ru
          npm run build:ru

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
